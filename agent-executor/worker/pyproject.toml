[project]
name = "agent-worker"
version = "0.1.0"
description = "Claims QUEUED tasks from PostgreSQL and executes them"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = ["e2e: starts the real Java API and runs the worker as a process (run with: uv run pytest -m e2e)"]
addopts = "-m 'not e2e'"
